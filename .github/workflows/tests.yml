name: Test & Build

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "scripts/**"
      - "turbo.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "plan/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "packages/**"
      - "scripts/**"
      - "turbo.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "plan/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-test-coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fallow:
    name: Fallow - Codebase Intelligence
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild native modules
        run: pnpm rebuild

      - name: Fallow
        uses: fallow-rs/fallow@647fe2d90f7316b9a95ccd690481224e9a95333b # v2.89.0
        continue-on-error: true
        with:
          command: audit
          format: sarif
          annotations: true
          comment: true
          review-comments: true
          review-guidance: false
          max-annotations: 50
          fail-on-issues: true
          gate: new-only

  unit-test-coverage:
    name: Unit tests (${{ matrix.group }})
    if: ${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: core
            filter: --filter=@agentsy/shared --filter=@agentsy/core --filter=@agentsy/providers --filter=@agentsy/gateway --filter=@agentsy/models --filter=@agentsy/tokenomics --filter=@agentsy/observability
          - group: runtime
            filter: --filter=@agentsy/guardrails --filter=@agentsy/runtime --filter=@agentsy/orchestrator --filter=@agentsy/session --filter=@agentsy/memory --filter=@agentsy/retrieval --filter=@agentsy/secrets
          - group: surface
            filter: --filter=@agentsy/cli --filter=@agentsy/ui --filter=@agentsy/tools --filter=@agentsy/prompts --filter=@agentsy/vscode --filter=@agentsy/testing --filter=@agentsy/plugins --filter=@agentsy/agents --filter=@agentsy/bootstrap --filter=@agentsy/daemon

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild native modules
        run: pnpm rebuild

      - name: Run release tooling tests
        run: pnpm test:release
        env:
          CI: true

      - name: Run unit tests with coverage and JUNIT
        env:
          CI: true
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          pnpm turbo run coverage ${{ matrix.filter }} --concurrency=2 -- \
            --coverage.reporter=json \
            --coverage.reporter=lcov \
            --coverage.reporter=text \
            --reporter=junit \
            --outputFile.junit=test-report.junit.xml
        continue-on-error: false

      - name: Upload test results to GitHub
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: test-results-${{ matrix.group }}
          path: packages/*/test-report.junit.xml
          retention-days: 7

      - name: Upload raw coverage artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-reports-${{ matrix.group }}
          path: packages/*/coverage/coverage-final.json
          retention-days: 7

  merge-and-upload-coverage:
    name: Merge & upload coverage
    if: always()
    needs: [unit-test-coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Download core coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-reports-core
          path: coverage-input

      - name: Download runtime coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-reports-runtime
          path: coverage-input

      - name: Download surface coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-reports-surface
          path: coverage-input

      - name: Merge coverage reports
        uses: selfagency/merge-coverage@4f847ad20e457b1b08b73acd5e8de2fca504385c
        with:
          source: ${{ github.workspace }}
          coverage-reports: ${{ github.workspace }}/coverage-input
          output-folder: ${{ github.workspace }}/coverage
          formats: lcov

      - name: Upload test results to Codecov
        if: always()
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Run codacy-coverage-reporter
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699
        with:
          api-token: ${{ secrets.CODACY_API_TOKEN }}
          coverage-reports: ${{ github.workspace }}/coverage/lcov.info

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  e2e-cli-tests:
    name: CLI E2E (tui-test)
    if: ${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI package (deps first)
        run: pnpm turbo run build --filter @agentsy/cli

      - name: Run CLI E2E tests
        run: pnpm --filter @agentsy/cli test:e2e:dev
        env:
          CI: true

      - name: Upload tui-test traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tui-traces
          path: packages/cli/tui-traces/
          retention-days: 7
