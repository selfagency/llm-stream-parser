##########################
# Required configuration #
##########################

sonar.projectKey=agentsy
sonar.projectName=agentsy
sonar.projectVersion=0.2.0
sonar.language=javascript

# Project description
sonar.projectDescription=agentic framework

# Path to source directories
sonar.sources=packages
# Path to test directories (comment if no test)
sonar.tests=packages


##########################
# Optional configuration #
##########################

# Encoding of the source code
sonar.sourceEncoding=UTF-8
# Exclude tooling, docs, and lockfiles from analysis
sonar.exclusions=**/*.md,**/*.mdx,.agents/**,scripts/**,plan/**,docs/**,.github/**,.husky/**,.vitepress/**,.vscode/**,.zed/**,.cmux/**,.opencode/**,config/**,.fallow/**,coverage/**,**/dist/**,**/node_modules/**,**/pnpm-lock.yaml,**/package-lock.json,**/yarn.lock
sonar.cpd.exclusions=**/*.test.ts,**/ethics/registry.ts,packages/tools/src/shell/index.ts,packages/runtime/src/sandbox/persistent-shell.ts,packages/daemon/src/services/output-validator.ts,packages/core/src/structured/validate-json-schema.ts
